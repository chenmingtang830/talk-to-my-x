[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-to-my-x"
version = "0.1.0"
description = "Local state engine for talking to your personal X through Codex"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Richard Tang" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/chenmingtang830/talk-to-my-x"
Repository = "https://github.com/chenmingtang830/talk-to-my-x"

[project.scripts]
talk-to-my-x = "talk_to_my_x.cli:main"

[tool.setuptools.packages.find]
where = ["plugins/talk-to-my-x/lib"]

[tool.setuptools.package-data]
talk_to_my_x = ["templates/*.md"]
