name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste X tokens, OAuth credentials, or the contents of your local
        memory files. For anything exploitable, use a private security advisory
        instead — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Setup check output
      description: >-
        Output of `talk-to-my-x doctor`, or what the agent reported from the
        setup check. Redact paths you would rather not share.
      render: json

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 -V`
      placeholder: "3.12.4"

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I confirmed `xurl auth status` shows an authenticated identity
        - label: This report contains no credentials or personal memory content
          required: true
