<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X-LiveCast · Voice Room</title>
  <meta property="og:title" content="X-LiveCast Voice Room" />
  <meta property="og:description" content="A live, interruptible voice briefing from your X feed." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="X-LiveCast Voice Room" />
  <meta name="twitter:description" content="A live, interruptible voice briefing from your X feed." />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="room">
    <header class="room__header">
      <div class="brand">
        <span class="brand__dot"></span>
        X-LiveCast
      </div>
      <span id="status" class="status status--idle">idle</span>
    </header>

    <div class="thread-bar">
      <select id="sessionSelect" class="thread-select" aria-label="Conversation thread">
        <option value="">New conversation</option>
      </select>
      <button id="newThreadBtn" class="btn-mini" type="button">New</button>
    </div>

    <div class="call-controls">
      <button id="playBtn" class="call-btn" title="Start or pause">
        <span class="call-btn__icon" id="playIcon">▶</span>
        <span class="call-btn__label" id="playLabel">Start</span>
      </button>
      <p class="call-hint" id="playHint">Tap Start — live call-in. Hang up anytime; come back to continue.</p>
    </div>

    <section class="thread" id="captions" aria-live="polite">
      <p class="thread__hint">Your brief lands here like a DM — same words as the host, with (post) links inline. Hang up keeps the thread; Synthesize turns it into a post draft.</p>
    </section>

    <section class="draft-panel is-hidden" id="draftPanel">
      <div class="draft-panel__head">
        <span class="draft-panel__label">Post draft</span>
        <div class="draft-panel__actions">
          <button id="copyDraftBtn" class="btn-mini" type="button">Copy</button>
          <button id="publishBtn" class="btn-mini btn-mini--accent" type="button">Publish to X</button>
        </div>
      </div>
      <textarea id="draftText" class="draft-panel__edit" rows="8" spellcheck="true" placeholder="Synthesize a draft, edit it, then Publish (confirm required)."></textarea>
      <p class="draft-panel__meta" id="draftMeta"></p>
      <p class="draft-panel__result is-hidden" id="draftResult"></p>
    </section>

    <footer class="controls">
      <button id="muteBtn" class="btn" disabled>Mute mic</button>
      <button id="hangupBtn" class="btn" disabled>Hang up</button>
      <button id="synthBtn" class="btn btn--primary" disabled>Synthesize</button>
    </footer>

    <details class="brief" id="briefPanel">
      <summary>Today's brief (preview)</summary>
      <pre id="briefText" class="brief__text">Loading…</pre>
    </details>
  </main>

  <script src="/app.js"></script>
</body>
</html>
